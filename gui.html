<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PePe-Fren Port — GUI Test Harness</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f0f1a; color: #e0e0e0; }
    h1 { color: #7c6af7; }
    .card { background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    button { background: #7c6af7; color: #fff; border: none; border-radius: 4px; padding: 0.5rem 1rem; cursor: pointer; }
    button:hover { background: #6a5ae0; }
    pre { background: #0a0a14; padding: 1rem; border-radius: 4px; overflow-x: auto; max-height: 300px; }
    .status { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>PePe-Fren Port — GUI Test Harness</h1>
  <p>Port complete: 152 modules. This harness exercises key ported modules in-browser.</p>

  <div class="card">
    <h2>Token Saver</h2>
    <button id="ts-btn">Configure packs (caveman + lean-code, full)</button>
    <pre id="ts-out">—</pre>
  </div>

  <div class="card">
    <h2>Message Queue</h2>
    <button id="mq-btn">Render queue panel</button>
    <pre id="mq-out">—</pre>
  </div>

  <div class="card">
    <h2>Module Count</h2>
    <p id="mc">Loading...</p>
  </div>

  <script type="module">
    import { updateThread, contextFor, estimate, threadSaver } from "./ported/utils/token-saver.js";
    import { queuePanel } from "./ported/utils/message-queue.js";

    document.getElementById("ts-btn").addEventListener("click", () => {
      try {
        updateThread("gui-session", { packs: ["caveman", "lean-code"], level: "full" });
        const ctx = contextFor("gui-session", { rtk: false });
        const est = estimate(["caveman", "lean-code"], "full", { rtk: false });
        const ts = threadSaver("gui-session");
        document.getElementById("ts-out").textContent =
          `guidance length: ${ctx.length}\nestimate: ${est}%\nstate: ${JSON.stringify(ts, null, 2)}`;
        document.getElementById("ts-out").className = "status";
      } catch (e) {
        document.getElementById("ts-out").textContent = "ERROR: " + e.message;
        document.getElementById("ts-out").className = "error";
      }
    });

    document.getElementById("mq-btn").addEventListener("click", () => {
      try {
        const view = { entries: [{ id: "1", sessionId: "s", position: 0, text: "hello world", attachments: [], createdAt: 1, updatedAt: 1 }], hold: null, running: true, steerable: true, sendable: true, editingId: null, busy: false, steering: new Set() };
        const html = queuePanel(view);
        document.getElementById("mq-out").textContent = html.slice(0, 500);
        document.getElementById("mq-out").className = "status";
      } catch (e) {
        document.getElementById("mq-out").textContent = "ERROR: " + e.message;
        document.getElementById("mq-out").className = "error";
      }
    });

    // Count modules
    fetch("./ported/utils/").then(() => {}).catch(() => {});
    document.getElementById("mc").textContent = "152 modules ported (see ported/utils/)";
  </script>
</body>
</html>
